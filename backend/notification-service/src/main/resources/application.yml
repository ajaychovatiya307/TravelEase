# TravelEase - Notification Service
# Unversioned API surface (NFR-06): every endpoint is served under the /api context path.
# NOTE: The context path is empty — controllers must include the /api prefix in their own mappings.
server:
  port: 8085
  servlet:
    context-path: ""

spring:
  mail:
    host: ${TRAVELEASE_SMTP_HOST:}
    port: ${TRAVELEASE_SMTP_PORT:587}
    username: ${TRAVELEASE_SMTP_USERNAME:}
    password: ${TRAVELEASE_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${TRAVELEASE_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${TRAVELEASE_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties]"
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://${TRAVELEASE_DB_HOST:localhost}:${TRAVELEASE_DB_PORT:3306}/travelease_notification?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    # Credentials come from the environment (or a git-ignored backend/.env in local dev).
    # Production startup fails if these are missing or a known default (common-lib ProductionSafetyEnvironmentPostProcessor).
    username: ${TRAVELEASE_DB_USERNAME}
    password: ${TRAVELEASE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    # #18: schema is owned by versioned migrations (src/main/resources/db/migration).
    # Existing databases created by the old ddl-auto=update are baselined at V1 (the captured
    # existing schema) and only receive V2+; empty databases get V1 then V2.
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # Hibernate only checks the schema; it never alters it.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    database-platform: org.hibernate.dialect.MySQLDialect

logging:
  level:
    root: INFO
    com.travelease: INFO

admin-service:
  internal-base-url: ${ADMIN_SERVICE_INTERNAL_URL:http://localhost:8082}
  finance-recipients-url: ${ADMIN_SERVICE_FINANCE_RECIPIENTS_URL:http://localhost:8082/internal/recipients/finance}

security:
  internal:
    # Service-to-service credential secret (>= 32 bytes, different from the JWT secret). Required:
    # event ingestion and admin /internal/** endpoints only accept tokens signed with it.
    secret: ${TRAVELEASE_INTERNAL_SECRET:}
  jwt:
    # Shared HS256 verification secret (>= 32 bytes). No fallback: startup fails when it is missing.
    secret: ${TRAVELEASE_JWT_SECRET:}

travelease:
  notifications:
    # Link included in notification e-mails.
    app-base-url: ${TRAVELEASE_APP_BASE_URL:http://localhost:5173}
    email:
      # Off by default: in-app notifications only. When true, SMTP settings below are required
      # (startup fails otherwise) and e-mails are sent after commit with bounded retries.
      enabled: ${TRAVELEASE_EMAIL_ENABLED:false}
      from: ${TRAVELEASE_EMAIL_FROM:no-reply@travelease.local}
      max-attempts: 5


management:
  health:
    mail:
      # Probe the SMTP server only when e-mail delivery is switched on. With e-mail off (the default)
      # there is no server to reach, and the mail check would otherwise report the service DOWN.
      enabled: ${TRAVELEASE_EMAIL_ENABLED:false}
